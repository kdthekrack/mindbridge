[project]
name = "mindbridge"
version = "0.1.0"
description = "AI-powered mental wellness platform using Flask, Gemini, and emotion detection."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "flask>=3.1.0",
    "python-dotenv>=1.0.1",
    "google-genai>=1.15.0",
    "transformers>=4.51.3",
    "torch>=2.7.0",
    "accelerate>=1.6.0",
]

[tool.uv]
dev-dependencies = [
    "black>=25.1.0",
    "ruff>=0.11.9",
]
